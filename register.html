<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | LMS</title>

  <!-- SEO & security basics -->
  <meta name="description" content="Create an LMS account" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <main class="auth-layout">
    <section class="auth-card" aria-labelledby="register-heading">
      <header class="auth-header">
        <h1 id="register-heading">Create your account</h1>
        <p class="auth-subtitle">
          Register to access the Learning Management System
        </p>
      </header>

      <form id="registerForm" novalidate>
        <!-- Full name -->
        <div class="form-group">
          <label for="name">Full name</label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
            minlength="2"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="8"
            aria-describedby="password-hint"
          />
          <small id="password-hint" class="form-hint">
            Minimum 8 characters
          </small>
        </div>

        <!-- Confirm password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- Error feedback -->
        <p
          id="formError"
          class="form-error"
          role="alert"
          aria-live="polite"
        ></p>

        <!-- Submit -->
        <button
          type="submit"
          class="btn btn-primary"
          data-loading-text="Creating account…"
        >
          Create account
        </button>
      </form>

      <footer class="auth-footer">
        <p>
          Already have an account?
          <a href="/index.html">Sign in</a>
        </p>
      </footer>
    </section>
  </main>

  <!-- Scripts -->
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
