<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | LMS</title>

  <!-- Baseline metadata -->
  <meta name="description" content="LMS Dashboard" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <!-- App Layout -->
  <div class="app-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-header">
        <h1 class="logo">LMS</h1>
      </div>

      <nav class="nav">
        <ul class="nav-list">
          <!-- Common -->
          <li>
            <a href="#" data-nav="overview">Overview</a>
          </li>

          <!-- Admin-only -->
          <li data-role="ADMIN">
            <a href="#" data-nav="sessions">Sessions</a>
          </li>
          <li data-role="ADMIN">
            <a href="#" data-nav="attendance">Attendance</a>
          </li>
          <li data-role="ADMIN">
            <a href="#" data-nav="assignments">Assignments</a>
          </li>

          <!-- Member-only -->
          <li data-role="MEMBER">
            <a href="#" data-nav="my-sessions">My Sessions</a>
          </li>
          <li data-role="MEMBER">
            <a href="#" data-nav="feedback">Feedback</a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-secondary">
          Log out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent" tabindex="-1">
      <!-- JS will render views here -->

      <section class="empty-state" id="dashboardLoading">
        <p>Loading dashboard…</p>
      </section>
    </main>

  </div>

  <!-- Scripts -->
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
